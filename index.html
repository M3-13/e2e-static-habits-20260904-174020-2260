<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habit-Tracker</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="app-header">
    <h1 class="app-title">Habit-Tracker</h1>
    <div class="header-actions">
      <button id="theme-toggle" class="toggle-switch" type="button" role="switch" aria-checked="false" aria-label="Dark Mode umschalten">
        <span class="toggle-switch-thumb"></span>
      </button>
      <button id="filter-toggle" class="icon-btn" type="button" aria-label="Archivansicht umschalten">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 5h16M7 12h10M10 19h4"></path>
        </svg>
      </button>
      <button id="export-btn" class="icon-btn" type="button" aria-label="Daten exportieren">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"></path>
        </svg>
      </button>
      <button id="import-btn" class="icon-btn" type="button" aria-label="Daten importieren">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 20V9m0 0l-4 4m4-4l4 4M5 4h14"></path>
        </svg>
      </button>
      <input type="file" id="import-file" accept="application/json,.json" hidden>
    </div>
  </header>

  <main class="app-main">
    <form id="habit-form" class="habit-form" novalidate>
      <input type="text" id="habit-name" class="input" placeholder="Neue Gewohnheit …" maxlength="100" autocomplete="off">
      <button type="submit" class="btn btn-primary">Hinzufügen</button>
    </form>

    <div id="habit-list" class="habit-list">
      <div id="empty-state" class="empty-state">
        <div class="empty-state-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12l4 4L19 6"></path>
          </svg>
        </div>
        <h2 class="empty-state-heading">Noch keine Gewohnheiten</h2>
        <p class="empty-state-text">Lege oben deine erste Gewohnheit an, um loszulegen.</p>
      </div>
    </div>
  </main>

  <footer class="app-footer">
    <a href="datenschutz.html">Datenschutz</a>
    <a href="impressum.html">Impressum</a>
  </footer>

  <script src="js/store.js"></script>
  <script src="js/dates.js"></script>
  <script src="js/habits.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/grid.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/chart.js"></script>
  <script src="js/archive.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/transfer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
